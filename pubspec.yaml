name: hospital_management_system
description: Hospital Management System using Flutter and Firebase
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0

  # Local storage
  shared_preferences: ^2.5.3

  # Date and time formatting
  intl: ^0.20.2

  # PDF report generation
  pdf: ^3.11.3
  printing: ^5.14.2

  # iOS icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true